<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      /* Ensure window.fetch has a setter so browser extensions or interceptors don't throw TypeError */
      (function() {
        try {
          var _currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(fn) {
              _currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}

        /* Prevent 3rd-party browser extension errors from breaking application execution */
        window.addEventListener('error', function(e) {
          if (
            (e.filename && e.filename.indexOf('chrome-extension://') !== -1) ||
            (e.message && e.message.indexOf('Cannot set property fetch of #<Window>') !== -1)
          ) {
            e.preventDefault();
            e.stopPropagation();
            return true;
          }
        }, true);
      })();
    </script>
